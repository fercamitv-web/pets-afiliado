name: Rodada de conteudo

on:
  schedule:
    # seg/qua/sex as 09:00 UTC = 06:00 em Brasilia
    # 3 artigos/semana: cabem em 2-3h/semana de revisao humana.
    # Para acelerar depois, mude para "0 9 * * *" (diario).
    - cron: "0 9 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Gerar conteudo
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python scripts/run.py --artigos 1
      - name: Indexar
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python scripts/indexar.py
      - name: Commit
        run: |
          git config user.name "agente"
          git config user.email "agente@users.noreply.github.com"
          git add -A
          git commit -m "conteudo: $(date -u +%F)" || echo "nada novo"
          git push
